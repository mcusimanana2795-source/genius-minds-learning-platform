<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b46"><meta name="description" content="Genius Minds concept learning, assessments and progress tracking"><title>Genius Minds | Learning Platform</title>
<style>
:root{--navy:#142b46;--gold:#d3aa58;--ink:#182b40;--muted:#68788a;--paper:#f3f6fa;--line:#e1e7ef;--white:#fff;--green:#16845b;--red:#b84343}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,Arial,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--navy);color:#fff;padding:24px 16px}.brand{display:flex;gap:12px;align-items:center;margin:0 6px 30px}.logo{background:var(--gold);color:var(--navy);font-weight:900;border-radius:12px;padding:12px;font-size:19px}.brand small{display:block;color:#cbd5df;font-size:10px;letter-spacing:1.6px}.nav button,.role{width:100%;border:0;background:transparent;color:#dbe4ed;padding:12px;text-align:left;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover,.role:hover{background:#29425e;color:#fff}.side .hint{font-size:12px;color:#c1cedb;margin:24px 8px}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:15px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:2}.top strong{font-size:14px}.top small{color:var(--muted)}.content{max-width:1200px;margin:auto;padding:28px}.welcome{background:linear-gradient(120deg,#142b46,#284866);color:white;border-radius:18px;padding:26px;margin-bottom:22px}.welcome h1{margin:0 0 6px;font-size:27px}.welcome p{margin:0;color:#e2eaf1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 12px #152b4608}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.stat{font-size:27px;font-weight:800;color:var(--navy)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn.gold{background:var(--gold);color:var(--navy)}.btn.light{background:#edf2f7;color:var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink)}label{display:block;font-weight:650;margin:12px 0 5px}.field{min-width:170px}.course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.course{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff;cursor:pointer}.course:hover{border-color:var(--gold);transform:translateY(-1px)}.tag{font-size:11px;font-weight:800;letter-spacing:.5px;color:#77571c;background:#fbf2dc;border-radius:20px;padding:4px 8px}.progress{height:8px;background:#e9eef3;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.concept{border-left:4px solid var(--gold);padding:3px 0 3px 14px;margin:18px 0}.example{background:#f6f8fb;border-radius:10px;padding:13px;margin:12px 0}.q{padding:15px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.q p{margin:0 0 8px;font-weight:650}.q label{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:7px 0}.q input[type=radio]{margin-top:5px}.feedback{border-radius:9px;padding:12px;margin:8px 0}.good{background:#e7f5ee;color:#145d40}.bad{background:#fff0ef;color:#8d2929}.notice{background:#fff8e8;border:1px solid #f0dfb8;padding:12px;border-radius:10px;margin:12px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f5f7fa;color:#46596d}.pill{border-radius:20px;padding:4px 8px;font-size:11px;font-weight:800;background:#e9f4ee;color:#176044}.pill.warn{background:#fff0df;color:#805018}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.hidden{display:none!important}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.score{font-size:36px;font-weight:900;color:var(--navy)}.footer{padding:20px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{padding:12px;position:static}.brand{margin-bottom:8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.side .hint{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:18px}.top{padding:12px 18px}}@media(max-width:560px){.grid,.course-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.welcome h1{font-size:22px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="logo">GM</div><div><b>GENIUS MINDS</b><small>LEARN • PRACTISE • MASTER</small></div></div><nav class="nav"><button class="active" data-view="home">⌂ &nbsp; Dashboard</button><button data-view="learn">▤ &nbsp; My learning</button><button data-view="results">✓ &nbsp; My results</button><button data-view="teacher">▦ &nbsp; Tutor dashboard</button><button data-view="settings">⚙ &nbsp; Settings</button></nav><p class="hint">Every concept ends with an assessment. Mastery is earned through demonstrated understanding.</p></aside><main class="main"><header class="top"><div><strong id="pageTitle">Learner dashboard</strong><br><small>Genius Minds Tutoring • South Africa</small></div><div class="row"><label for="learner" class="small">Learner profile</label><input id="learner" class="field" value="Demo Learner" aria-label="Learner name"><select id="role" aria-label="View role"><option value="learner">Learner view</option><option value="teacher">Tutor / admin view</option></select></div></header><div class="content" id="app"></div><div class="footer">Genius Minds • Learning data in this demonstration is stored in this browser on this device.</div></main></div>
<script>
const courses=[
{grade:3,subject:'Afrikaans FAL',term:1,concepts:[['Selfstandige naamwoorde','A noun names a person, place, animal or thing.','meisie, skool, hond, boek','Find the naming words in a sentence.'],['Werkwoorde','A verb tells us what someone or something does.','hardloop, lees, skryf, sing','Look for the action word.']]},
{grade:3,subject:'English',term:1,concepts:[['Nouns','A noun is the name of a person, place, animal or thing.','teacher, park, cat, pencil','A proper noun names a specific person or place and begins with a capital letter.'],['Pronouns','A pronoun takes the place of a noun.','he, she, it, they, we','Use a pronoun to avoid repeating a name.'],['Verbs','A verb tells what someone or something does or is.','jump, read, is, are','Find the action or being word.']]},
{grade:4,subject:'Natural Sciences',term:1,concepts:[['Living and non-living things','Living things carry out life processes. Non-living things do not.','A plant grows; a stone does not.','Living things need energy and can grow and reproduce.'],['Life processes','Living things carry out processes such as nutrition, respiration, growth and reproduction.','A seed germinates and grows into a plant.','Use evidence to decide whether something is living.']]},
{grade:5,subject:'Afrikaans FAL',term:1,concepts:[['Meervoude','A plural tells us there is more than one.','boek – boeke; hond – honde','Notice how the word ending changes.'],['Teenoorgesteldes','Opposites have contrasting meanings.','warm – koud; groot – klein','Choose a word with the opposite meaning.']]},
{grade:5,subject:'Life Skills',term:1,concepts:[['Self-concept','Self-concept is how you see and understand yourself.','Your strengths, interests and values.','A healthy self-concept includes recognising strengths and areas to improve.']]},
{grade:7,subject:'Afrikaans FAL',term:1,concepts:[['Byvoeglike naamwoorde','An adjective describes a noun.','Die pragtige blom; ’n vinnige motor.','Adjectives add detail and can appear before or after a noun.'],['Ontkenning','Negative form changes a statement into a negative sentence.','Ek eet brood. → Ek eet nie brood nie.','In Afrikaans, nie ... nie is commonly used around the relevant sentence part.']]},
{grade:7,subject:'Natural Sciences',term:1,concepts:[['Photosynthesis','Plants use light energy to make glucose from carbon dioxide and water, releasing oxygen.','Light + water + carbon dioxide → glucose + oxygen.','Chlorophyll in green leaves absorbs light energy.'],['Food chains','A food chain shows how energy moves between organisms.','Grass → grasshopper → frog → snake.','Arrows point in the direction energy is transferred.']]},
{grade:7,subject:'EMS',term:1,concepts:[['Needs and wants','Needs are essentials for living; wants are things people would like to have.','Food is a need; a new game is usually a want.','Limited resources mean choices must be made.']]},
{grade:7,subject:'Technology',term:1,concepts:[['The design process','The design process includes investigating, designing, making, evaluating and communicating.','A learner investigates a problem before designing a solution.','Testing and improving are important parts of the process.']]}
];
const storeKey='gm_assessment_v2';const app=document.getElementById('app');let db=load();db.attempts=Array.isArray(db.attempts)?db.attempts:[];db.mastery=db.mastery&&typeof db.mastery==='object'?db.mastery:{};db.threshold=Number.isFinite(Number(db.threshold))?Number(db.threshold):70;db.scale=Array.isArray(db.scale)&&db.scale.length?db.scale:[{min:80,grade:'A',label:'Excellent'},{min:70,grade:'B',label:'Good'},{min:60,grade:'C',label:'Satisfactory'},{min:50,grade:'D',label:'Basic'},{min:0,grade:'E',label:'Needs support'}];let current=null,attempt=0,questions=[],answers={},lastResult=null;
function load(){try{return JSON.parse(localStorage.getItem(storeKey))||{attempts:[],mastery:{},threshold:70,scale:[{min:80,grade:'A',label:'Excellent'},{min:70,grade:'B',label:'Good'},{min:60,grade:'C',label:'Satisfactory'},{min:50,grade:'D',label:'Basic'},{min:0,grade:'E',label:'Needs support'}]}}catch(e){return{attempts:[],mastery:{},threshold:70,scale:[{min:80,grade:'A'},{min:70,grade:'B'},{min:60,grade:'C'},{min:50,grade:'D'},{min:0,grade:'E'}]}}}
function save(){localStorage.setItem(storeKey,JSON.stringify(db))}
function who(){return document.getElementById('learner').value.trim()||'Demo Learner'}
function key(c){return [c.grade,c.subject,c.term,c.concept].join('|')}
function concepts(){return courses.flatMap(c=>c.concepts.map(x=>({grade:c.grade,subject:c.subject,term:c.term,concept:x[0],explain:x[1],examples:x[2],tip:x[3]})))}
function resultFor(c){return db.attempts.filter(a=>a.learner===who()&&a.key===key(c))}
function best(c){let a=resultFor(c);return a.length?Math.max(...a.map(x=>x.percent)):null}
function latest(c){let a=resultFor(c);return a.length?a[a.length-1]:null}
function grade(p){return (db.scale||[]).slice().sort((a,b)=>b.min-a.min).find(x=>p>=x.min)?.grade||'E'}
function mastered(c){return best(c)!==null&&best(c)>=db.threshold}
function view(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.getElementById('pageTitle').textContent=({home:'Learner dashboard',learn:'My learning',results:'My assessment results',teacher:'Tutor and administrator dashboard',settings:'Assessment settings'})[name];({home:home,learn:learn,results:results,teacher:teacher,settings:settings}[name]||home)()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>view(b.dataset.view));document.getElementById('role').onchange=e=>view(e.target.value==='teacher'?'teacher':'home');document.getElementById('learner').onchange=()=>view('home');
function home(){let cs=concepts(),done=cs.filter(c=>latest(c)).length,mas=cs.filter(mastered).length,avg=done?Math.round(cs.filter(c=>latest(c)).reduce((s,c)=>s+latest(c).percent,0)/done):0;app.innerHTML=`<section class="welcome"><h1>Welcome to Genius Minds</h1><p>Learn each concept, practise with purpose and prove what you know.</p></section><div class="grid"><div class="card"><div class="muted">Concepts assessed</div><div class="stat">${done}/${cs.length}</div></div><div class="card"><div class="muted">Concepts mastered</div><div class="stat">${mas}</div></div><div class="card"><div class="muted">Latest-result average</div><div class="stat">${avg}%</div></div></div><div class="row" style="margin:24px 0 12px"><h2>Continue learning</h2><button class="btn gold" onclick="view('learn')">Browse concepts</button></div><div class="course-grid">${cs.slice(0,6).map(c=>courseCard(c)).join('')}</div>`}
function courseCard(c){let l=latest(c),b=best(c);return `<div class="course" onclick="openConcept('${encodeURIComponent(key(c))}')"><div class="row"><span class="tag">GRADE ${c.grade} • TERM ${c.term}</span><span class="pill ${mastered(c)?'':'warn'}">${mastered(c)?'MASTERED':l?'IN PROGRESS':'NOT ATTEMPTED'}</span></div><h3 style="margin:12px 0 2px">${c.concept}</h3><div class="muted small">${c.subject}</div><p class="small muted">${c.explain}</p><div class="row small"><span>${l?'Latest: '+l.percent+'%':'Assessment required'}</span><span>${b!==null?'Best: '+b+'%':''}</span></div></div>`}
function learn(){app.innerHTML=`<div class="row"><div><h2>Learning library</h2><p class="muted">Choose a grade, subject and concept. Every concept has its own assessment.</p></div><div class="actions"><select id="gradeFilter" onchange="filterCourses()"><option value="">All grades</option>${[3,4,5,7].map(n=>`<option>${n}</option>`).join('')}</select><select id="subjectFilter" onchange="filterCourses()"><option value="">All subjects</option>${[...new Set(courses.map(c=>c.subject))].map(s=>`<option>${s}</option>`).join('')}</select></div></div><div id="courseList" class="course-grid">${concepts().map(courseCard).join('')}</div>`}
function filterCourses(){let g=document.getElementById('gradeFilter').value,s=document.getElementById('subjectFilter').value;document.getElementById('courseList').innerHTML=concepts().filter(c=>(!g||c.grade==g)&&(!s||c.subject===s)).map(courseCard).join('')}
function openConcept(encoded){let k=decodeURIComponent(encoded);current=concepts().find(c=>key(c)===k);if(!current)return;renderLesson()}
function speak(text){if(!('speechSynthesis'in window)){alert('Voice narration is not supported by this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-ZA';u.rate=.88;speechSynthesis.speak(u)}
function renderLesson(){let c=current;app.innerHTML=`<button class="btn light" onclick="view('learn')">← Back to learning library</button><div class="welcome" style="margin-top:16px"><span class="tag">GRADE ${c.grade} • ${c.subject} • TERM ${c.term}</span><h1>${c.concept}</h1><p>Study the explanation and examples, then complete the concept assessment.</p></div><div class="card"><div class="row"><h2>1. Understand the concept</h2><button class="btn gold" onclick="speak(document.getElementById('lessonText').innerText)">🔊 Listen to lesson</button></div><div id="lessonText"><p>${c.explain}</p><div class="example"><b>Examples</b><br>${c.examples}</div><div class="concept"><b>Remember</b><br>${c.tip}</div></div><div class="notice">Work through the examples carefully. The assessment below checks this concept specifically.</div><h3>2. Quick practice</h3><p>Explain the concept aloud in your own words. Then identify one new example from your everyday life.</p><textarea id="practiceNote" rows="2" placeholder="Write your own example here (optional)"></textarea><div class="row" style="margin-top:16px"><div><b>3. Ready to demonstrate mastery?</b><div class="muted small">Your assessment uses a fresh question order and may use alternative questions on retakes.</div></div><button class="btn gold" onclick="startTest()">Start concept assessment →</button></div></div>`}
function bank(c,variant){
 let ex=(c.examples||'').split(/[;,]/)[0].trim()||'a suitable example from the lesson',concept=c.concept||'this topic',explain=c.explain||'the main idea from the lesson',tip=c.tip||'the key point from the lesson';
 let base=[
  {type:'mcq',section:'SECTION A: Knowledge and understanding',marks:1,q:'1. Which statement best describes '+concept+'?',opts:[explain,'An idea that is unrelated to the topic.','A process with no purpose or meaning.','The opposite of the concept taught.'],a:0,why:'The correct response reflects the explanation taught in the lesson: '+explain},
  {type:'fill',section:'SECTION A: Knowledge and understanding',marks:1,q:'2. Give ONE example of '+concept+' from the lesson.',a:[ex.toLowerCase()],why:'Award marks for accurate facts or features from the lesson. Tutor should review equivalent correct responses.'},
  {type:'written',section:'SECTION B: Understanding',marks:4,q:'3. Explain '+concept+' in your own words. Include a relevant example and explain how the example shows the concept.',why:'Marking guide (4): accurate explanation (2); relevant example (1); clear link between example and concept (1). Accept equivalent correct wording.'},
  {type:'written',section:'SECTION B: Understanding',marks:3,q:'4. Explain why '+tip.toLowerCase()+' Give a reason to support your answer.',why:'Marking guide (3): relevant statement (1); accurate reason or explanation (2). Accept equivalent correct reasoning.'},
  {type:'written',section:'SECTION C: Application',marks:4,q:'5. Study this example from the lesson: '+ex+'. Explain how you would use what you have learned about '+concept+' in this situation. Show the steps or evidence that support your answer.',why:'Marking guide (4): identifies relevant information (1); selects an appropriate concept or method (1); applies it accurately (1); explains or checks the result (1).'},
  {type:'written',section:'SECTION D: Problem-solving and extended response',marks:6,q:'6. A learner is given an unfamiliar question about '+concept+'. Describe how the learner should approach the question and produce a complete answer. Include the method, important subject vocabulary and how the final answer should be checked.',why:'Marking guide (6): interprets the question/instruction (1); identifies relevant information (1); selects an appropriate method (1); shows logical steps or evidence (1); uses subject vocabulary (1); checks and communicates a complete answer (1).'}
 ];
 if(variant%2){base[0].q='1. Select the statement that most accurately explains '+concept+'.';base[1].q='2. State TWO different facts, features or steps connected to '+concept+'.';base[5].q='6. Describe how you would solve a new problem involving '+concept+'. Explain your method and how you would check your final answer.'}
 return base;
}
function startTest(){attempt=resultFor(current).length;questions=current.assessment&&current.assessment.length?current.assessment:bank(current,attempt);answers={};renderTest()}
function renderTest(){let c=current,total=questions.reduce((n,q)=>n+(q.marks|| (q.type==='match'?3:1)),0);app.innerHTML=`<button class="btn light" onclick="renderLesson()">← Back to lesson</button><div class="row" style="margin:15px 0"><div><h2>${c.concept} – Classroom assessment</h2><p class="muted">Grade ${c.grade} ${c.subject} • Term ${c.term} • Attempt ${attempt+1}</p></div><span class="tag">${questions.length} QUESTIONS • ${total} MARKS</span></div><div class="notice"><b>Instructions:</b> Read each question carefully. Pay attention to instruction words. Show calculations, steps, labels or evidence where required. Written answers are submitted for tutor marking; any displayed percentage is provisional until those marks are entered.</div><form id="testForm">${questions.map((q,i)=>(i===0||q.section!==questions[i-1].section?'<h3 class="gm-assessment-section">'+(q.section||'Assessment questions')+'</h3>':'')+questionHTML(q,i)).join('')}<button class="btn gold" type="submit">Submit assessment</button></form>`;document.getElementById('testForm').onsubmit=e=>{e.preventDefault();submitTest()}}
function questionHTML(q,i){let html='',marks=q.marks||(q.type==='match'?3:1);if(q.type==='mcq')html=q.opts.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('');if(q.type==='tf')html=`<label><input type="radio" name="q${i}" value="true"> True</label><label><input type="radio" name="q${i}" value="false"> False</label>`;if(q.type==='fill')html=`<input style="width:100%" name="q${i}" placeholder="Type your answer">`;if(q.type==='match')html=q.pairs.map((p,j)=>`<label>${p[0]} <select name="q${i}_${j}"><option value="">Choose a match</option>${q.pairs.map((x,k)=>`<option value="${k}">${x[1]}</option>`).join('')}</select></label>`).join('');if(q.type==='written')html=`<textarea name="q${i}" rows="4" style="width:100%" placeholder="Write a complete answer. Show your reasoning where needed."></textarea>`;return `<div class="q"><p>${i+1}. ${q.q}</p><div class="muted small">${marks} mark${marks===1?'':'s'} • ${q.type==='written'?'Written response • Tutor marking':q.type==='match'?'Matching':q.type==='fill'?'Short response':'Select the best answer'}</div>${html}</div>`}
function submitTest(){let score=0,max=0,review=[],detail=[];questions.forEach((q,i)=>{if(q.type==='written'){let val=document.querySelector('[name="q'+i+'"]')?.value.trim()||'';let m=Number(q.marks||3);max+=m;review.push({question:q.q,answer:val,reason:q.why,marks:m});detail.push({q:q.q,correct:null,mark:'Pending/'+m,marks:m,explain:q.why,answer:val,review:true});return}let ok=false,answer='';if(q.type==='mcq'){let m=Number(q.marks||1);max+=m;let v=document.querySelector('[name="q'+i+'"]:checked')?.value;answer=v===undefined?'No answer':q.opts[+v];ok=+v===q.a;if(ok)score+=m;detail.push({q:q.q,correct:ok,mark:(ok?m:0)+'/'+m,explain:q.why,answer});return}if(q.type==='tf'){let m=Number(q.marks||1);max+=m;let v=document.querySelector('[name="q'+i+'"]:checked')?.value;answer=v||'No answer';ok=(v==='true')===q.trueA;if(ok)score+=m;detail.push({q:q.q,correct:ok,mark:(ok?m:0)+'/'+m,explain:q.why,answer});return}if(q.type==='fill'){let m=Number(q.marks||1);max+=m;let v=document.querySelector('[name="q'+i+'"]').value.trim();answer=v||'No answer';ok=(q.a||[]).some(a=>String(a).toLowerCase()===v.toLowerCase());if(ok)score+=m;detail.push({q:q.q,correct:ok,mark:(ok?m:0)+'/'+m,explain:q.why,answer});return}if(q.type==='match'){let m=Number(q.marks||3);max+=m;let n=0;answer=q.pairs.map((p,j)=>{let v=document.querySelector('[name="q'+i+'_'+j+'"]').value;if(+v===j)n++;return p[0]+': '+(v===''?'Not answered':q.pairs[+v]?.[1]||'')}).join('; ');let awarded=Math.round(n/3*m);score+=awarded;ok=n===3;detail.push({q:q.q,correct:ok,mark:awarded+'/'+m,explain:q.why,answer});return}if(ok)score++;detail.push({q:q.q,correct:ok,mark:ok?'1/1':'0/1',explain:q.why,answer})});let percent=max?Math.round(score/max*100):0,needsReview=review.length>0;let record={learner:who(),key:key(current),grade:current.grade,subject:current.subject,term:current.term,concept:current.concept,score,max,percent,gradeBand:grade(percent),date:new Date().toISOString(),attempt:attempt+1,needsReview,review,detail};db.attempts.push(record);if(!db.mastery[key(current)])db.mastery[key(current)]={};if(!needsReview)db.mastery[key(current)].mastered=percent>=db.threshold;save();lastResult=record;renderResult(record)}
function renderResult(r){let prev=resultFor(current).filter(a=>a.attempt<r.attempt).slice(-2)[0];app.innerHTML=`<div class="welcome"><span class="tag">ASSESSMENT COMPLETE</span><h1>${r.concept} – Your results</h1><p>${r.needsReview?'Provisional objective mark shown below. Written responses still need tutor marking before a final percentage or mastery decision can be confirmed.':'Your assessment has been marked automatically.'}</p></div><div class="grid"><div class="card"><div class="muted">Objective score</div><div class="score">${r.score}/${r.max}</div></div><div class="card"><div class="muted">Percentage</div><div class="score">${r.percent}%</div></div><div class="card"><div class="muted">Achievement grade</div><div class="score">${r.gradeBand}</div></div></div><div class="card" style="margin-top:16px"><h2>${r.percent>=db.threshold?'Well done!':'Keep practising – you can improve.'}</h2><p>${r.needsReview?'Your written responses are awaiting tutor marking. The percentage shown is provisional and does not yet determine mastery.':(r.percent>=db.threshold?'You have reached the current mastery threshold for this concept.':'You have not reached the mastery threshold of '+db.threshold+'%. Revisit the lesson, listen to the explanation and try another assessment.')}</p>${prev?'<p class="muted">Previous attempt: '+prev.percent+'% • Change: '+(r.percent-prev.percent)+' percentage points.</p>':''}<div class="progress"><span style="width:${r.percent}%"></span></div><h3>Question feedback</h3>${r.detail.map((d,i)=>`<div class="feedback ${d.review?'':' '+(d.correct?'good':'bad')+' '}"><b>${i+1}. ${d.q}</b><br>${d.review?'Tutor review required • '+(d.mark||'pending'):d.correct?'Correct – '+d.mark:'Review this answer – '+d.mark}<br><span class="small">${d.explain}</span></div>`).join('')}${r.review.length?'<div class="notice"><b>Written responses pending tutor marking:</b> '+r.review.map(x=>x.marks+' marks available – '+(x.answer||'No response submitted')+'<br><span class="small">'+x.reason+'</span>').join('<hr>')+'. The objective percentage is provisional until written marks are added.</div>':''}<div class="actions"><button class="btn gold" onclick="startTest()">Try a new assessment</button><button class="btn light" onclick="renderLesson()">Revise lesson</button><button class="btn light" onclick="view('results')">View all results</button></div></div>`}
function results(){let cs=concepts();app.innerHTML=`<h2>My concept results</h2><p class="muted">Latest and best results for each concept. A concept is mastered only when the best score reaches ${db.threshold}%.</p><div class="table-wrap card"><table><thead><tr><th>Grade / Subject / Term</th><th>Concept</th><th>Latest</th><th>Best</th><th>Attempts</th><th>Status</th></tr></thead><tbody>${cs.map(c=>{let a=resultFor(c),l=latest(c),b=best(c);return `<tr><td>Gr ${c.grade} • ${c.subject} • T${c.term}</td><td>${c.concept}</td><td>${l?l.score+'/'+l.max+' ('+l.percent+'%)':'—'}</td><td>${b===null?'—':b+'%'}</td><td>${a.length}</td><td>${mastered(c)?'<span class="pill">Mastered</span>':l?'<span class="pill warn">Revise</span>':'Not attempted'}</td></tr>`}).join('')}</tbody></table></div>`}

waiting review.</p>'}</div><div class="notice">This dashboard reads records saved in this browser. It is not yet a secure multi-user database; use demo data only.</div>`}
function settings(){app.innerHTML=`<h2>Assessment settings</h2><div class="card"><h3>Mastery threshold</h3><p class="muted">Initial default: 70%. Change this to set the percentage required to mark a concept mastered.</p><label>Mastery percentage</label><input id="threshold" type="number" min="1" max="100" value="${db.threshold}"><button class="btn gold" style="margin-top:12px" onclick="saveSettings()">Save threshold</button></div><div class="card" style="margin-top:14px"><h3>South African percentage grading scale (editable initial model)</h3><p class="muted">A configurable demonstration scale. Confirm the applicable school/grade policy before formal reporting.</p><div class="table-wrap"><table><tr><th>Minimum percentage</th><th>Achievement grade</th><th>Description</th></tr>${db.scale.map(x=>`<tr><td>${x.min}%</td><td>${x.grade}</td><td>${x.label||''}</td></tr>`).join('')}</table></div></div><div class="notice">For official school reporting, Genius Minds should configure the scale to the relevant assessment policy and grade. This starter scale is not a claim that one grading band applies universally.</div><button class="btn light" onclick="if(confirm('Clear all demo assessment data on this device?')){db.attempts=[];db.mastery={};save();view('home')}">Clear demo data on this device</button>`}

function exportCSV(){let rows=[['Learner','Grade','Subject','Term','Topic / concept','Mark achieved','Total marks','Percentage','Achievement grade','Attempt','Date','Written review required'],...db.attempts.map(a=>[a.learner,a.grade,a.subject,a.term,a.concept,a.score,a.max,a.percent,a.gradeBand,a.attempt,new Date(a.date).toLocaleString(),a.needsReview?'Yes':'No'])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');let url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='genius-minds-assessment-marks.csv';a.click();URL.revokeObjectURL(url)}

 async function connect(){let c=config();if(!c.clientId){status('Save your Google OAuth Client ID first.','warn');return}try{await loadGoogle();tokenClient=google.accounts.oauth2.initTokenClient({client_id:c.clientId,scope:scopes,callback:async resp=>{if(resp.error){status('Google authorisation failed: '+resp.error,'warn');return}token=resp.access_token;tokenExpires=Date.now()+(Number(resp.expires_in||3600)-60)*1000;status('Google account connected. Importing Classroom resources…','ok');await sync();if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(()=>{if(token&&Date.now()<tokenExpires&&!busy)sync()},5*60*1000)}});tokenClient.requestAccessToken({prompt:'consent'})}catch(e){status(e.message||'Could not start Google sign-in.','warn')}}
 async function api(url){let r=await fetch('https://classroom.googleapis.com/v1/'+url,{headers:{Authorization:'Bearer '+token}});if(!r.ok){let t=await r.text();throw Error('Classroom API '+r.status+': '+t.slice(0,240))}return r.json()}
 async function pages(path){let all=[],pageToken='';do{let q=path+(path.includes('?')?'&':'?')+'pageSize=100'+(pageToken?'&pageToken='+encodeURIComponent(pageToken):'');let r=await api(q);all=all.concat(r.courses||r.courseWork||r.courseWorkMaterials||[]);pageToken=r.nextPageToken||''}while(pageToken);return all}
 async function sync(){if(busy)return;busy=true;status('Checking your Google Classroom courses and resources…');try{let courses=await pages('courses?courseStates=ACTIVE');let imported=[];for(let course of courses){let base='courses/'+encodeURIComponent(course.id);let [assignments,materials]=await Promise.all([pages(base+'/courseWork'),pages(base+'/courseWorkMaterials')]);for(let x of assignments){let links=(x.materials||[]).flatMap(m=>{let z=[];if(m.link&&m.link.url)z.push({title:m.link.title||'Open resource',url:m.link.url});if(m.driveFile&&m.driveFile.driveFile&&m.driveFile.driveFile.alternateLink)z.push({title:m.driveFile.driveFile.title||'Drive file',url:m.driveFile.driveFile.alternateLink});if(m.youtubeVideo&&m.youtubeVideo.alternateLink)z.push({title:m.youtubeVideo.title||'YouTube video',url:m.youtubeVideo.alternateLink});return z});imported.push({id:course.id+'_assignment_'+x.id,type:'Assignment',courseId:course.id,courseName:course.name,title:x.title||'Untitled assignment',description:x.description||'',dueDate:x.dueDate?x.dueDate.year+'-'+x.dueDate.month+'-'+x.dueDate.day+(x.dueTime?' '+x.dueTime.hours+':'+(x.dueTime.minutes||'00'):''):'',links,updated:x.updateTime||x.creationTime||''})}for(let x of materials){let links=(x.materials||[]).flatMap(m=>{let z=[];if(m.link&&m.link.url)z.push({title:m.link.title||'Open resource',url:m.link.url});if(m.driveFile&&m.driveFile.driveFile&&m.driveFile.driveFile.alternateLink)z.push({title:m.driveFile.driveFile.title||'Drive file',url:m.driveFile.driveFile.alternateLink});if(m.youtubeVideo&&m.youtubeVideo.alternateLink)z.push({title:m.youtubeVideo.title||'YouTube video',url:m.youtubeVideo.alternateLink});return z});imported.push({id:course.id+'_material_'+x.id,type:'Class material',courseId:course.id,courseName:course.name,title:x.title||'Untitled class material',description:x.description||'',dueDate:'',links,updated:x.updateTime||x.creationTime||''})}}
 let d=getDB();d.classroomItems=imported;d.classroomLastSync=new Date().toISOString();saveDB(d);status('Sync complete. Imported '+imported.length+' resources from '+courses.length+' active courses.','ok');panel()}catch(e){status(e.message+' If this is the first connection, check that the Classroom API is enabled and your Gmail account is a test user.','warn')}finally{busy=false}}
 const oldView=window.view;window.view=function(v){if(v==='classroom'){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view==='classroom'));document.getElementById('pageTitle').textContent='Google Classroom integration';panel()}else oldView(v)};
 let nav=document.querySelector('.nav');if(nav&&!nav.querySelector('[data-view="classroom"]')){let b=document.createElement('button');b.dataset.view='classroom';b.textContent='▣ Google Classroom';b.onclick=()=>window.view('classroom');nav.appendChild(b)}
})();

<script>

  function addAssessmentRow(q){let wrap=document.getElementById('stQuestions'),n=wrap.querySelectorAll('.st-question').length+1,row=document.createElement('div');row.className='gm-resource st-question';row.innerHTML='<label>Question '+n+'</label><input class="st-q" style="width:100%" placeholder="Type the question" value="'+esc(q?.q||'')+'"><label>Answer options (separate each option with | )</label><input class="st-opts" style="width:100%" placeholder="Option A | Option B | Option C | Option D" value="'+esc((q?.opts||[]).join(' | '))+'"><label>Correct option number (1–4)</label><select class="st-correct">'+[1,2,3,4].map(v=>'<option value="'+(v-1)+'" '+((q?.a??0)===v-1?'selected':'')+'>'+v+'</option>').join('')+'</select><button type="button" class="btn light st-remove" style="margin-top:8px">Remove question</button>';wrap.appendChild(row);row.querySelector('.st-remove').onclick=()=>row.remove()}

<script>
/* Genius Minds Interactive Learning Engine v1 */
(function(){
 const $=id=>document.getElementById(id);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const safe=s=>{try{let u=new URL(String(s||''));return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}};
 let studioEdit=null, slideDraft=[], playerIndex=0, playerSlideQuiz={};
 const readDB=()=>{try{return JSON.parse(localStorage.getItem('gm_assessment_v2'))||{}}catch(e){return {}}};
 const writeDB=d=>{localStorage.setItem('gm_assessment_v2',JSON.stringify(d));if(typeof db!=='undefined')db=d};
 const subjects=['Afrikaans FAL','English','Mathematics','Natural Sciences','Social Sciences','Life Skills','EMS','Technology','Creative Arts','Other'];
 function defaultSlides(c){
  const lang=/afrikaans/i.test(c.subject)?'af-ZA':'en-ZA',concept=c.concept||'this topic',explain=c.explain||'Explore the main idea carefully.',examples=c.examples||'Think of a relevant example from your subject or everyday life.',tip=c.tip||'Explain the key idea in your own words.',practice=c.practiceQuestion||'Use the information in the example. What would you do first, and why?';
  return [
   {stage:'hook',title:'1. Start with a real-life situation',body:'Look closely at this situation: '+examples+'\n\nWhat do you notice? Where have you seen something similar? Take a moment to think before continuing.',narration:'Let us begin with something you may recognise. '+examples+'. Look carefully. What do you notice? Think about what you already know.',language:lang,keyPoint:'New learning makes more sense when we connect it to what we already know.'},
   {stage:'challenge',title:'2. Your learning challenge',body:'Our topic is '+concept+'. Before I explain it, try this question: '+practice+'\n\nBy the end of the lesson, you should be able to explain the idea, recognise it in an example, use a suitable method and answer a question independently.',narration:'Here is the challenge for today. Our topic is '+concept+'. First, think about the question on the screen. You do not need to know the answer yet. We will learn the method together.',language:lang,keyPoint:'Understand what the question is asking before trying to answer it.'},
   {stage:'explore',title:'3. Explore the pattern, problem or idea',body:explain+'\n\nStudy the example: '+examples+'\n\nWhat changes? What stays the same? What evidence or information helps you understand what is happening?',narration:'Let us investigate the idea. '+explain+'. Now compare that explanation with the example. Notice the details that help us recognise the concept.',language:lang,examples:examples},
   {stage:'vocabulary',title:'4. Learn the important words',body:'Topic: '+concept+'\n\nKey idea: '+tip+'\n\nImportant vocabulary must be understood and used correctly. Try explaining the key words in your own words before moving on.',narration:'Before we solve the problem, let us make sure the important words are clear. '+tip+'. These words help us explain our thinking accurately.',language:lang,keyPoint:'Use the correct subject vocabulary in your answers.'},
   {stage:'model',title:'5. Teacher demonstration: watch me work it out',body:'QUESTION\n'+practice+'\n\nTEACHER THINK-ALOUD\n1. Read the whole question. Underline or identify the instruction word.\n2. Identify the facts, clues, data or materials provided.\n3. Choose the correct concept, rule, process or method.\n4. Work through the answer in clear steps. Explain why each step is appropriate.\n5. Write the final answer in the form requested.\n6. Check that the answer is accurate and complete.\n\nWorked-example content: '+examples+'\n\nKey method: '+tip,narration:'Watch how I approach a classroom question. First, I read the entire question and identify exactly what it asks me to do. Next, I look for useful facts and clues. I choose the correct method, work through it step by step, and explain my reasoning. Finally, I check that my answer responds to the question. '+tip,language:lang,examples:examples,keyPoint:'A strong answer shows the method or reasoning, not only the final response.'},
   {stage:'guided',title:'6. Guided practice: let us answer together',body:'Now we will try a similar question together.\n\n'+practice+'\n\nPause and decide on your first step. Then use this prompt: '+tip+'\n\nWhen you continue, compare your approach with the teacher guidance.',narration:'Now it is your turn, but I will guide you. Pause and decide what the question is asking. What information will you use? What method will help? Think through your answer before selecting an option.',language:lang,activity:{prompt:'What should you do first when answering this question?',options:['Read the full question and identify what it asks.','Guess before looking at the information.','Copy the topic heading as the answer.','Skip the instructions and start writing.'],correct:0,feedback:'Correct. Identify the instruction and what the question requires before choosing a method.',tryAgain:'Return to the teacher demonstration. What did the teacher do before solving the problem?'}},
   {stage:'independent',title:'7. Independent practice: you try',body:'Complete this task without copying the worked example.\n\n'+practice+'\n\nWrite your answer in your exercise book. Show calculations, steps, labels, evidence or explanations where the subject requires them. Then check your response against the question.',narration:'Now work independently. Use the method you have learned, but do the thinking yourself. Show your steps and check that your final answer is complete.',language:lang,keyPoint:'Apply the method independently and show your working where required.'},
   {stage:'mistakes',title:'8. Common mistakes and how to correct them',body:'Watch out for these common mistakes:\n• Reading only part of the question.\n• Missing an instruction word such as describe, compare, calculate, explain or justify.\n• Choosing a method that does not fit the question.\n• Leaving out working, evidence, labels or subject vocabulary.\n• Giving a final answer without checking it.\n\nUse this check: '+tip,narration:'Let us check for common mistakes. Read every instruction, select a method that fits, show the evidence or working, and check your final answer. A good answer must answer exactly what was asked.',language:lang,keyPoint:'Check the instruction word, method, working and final response.'},
   {stage:'transfer',title:'9. Apply the learning in a new situation',body:'Can you use '+concept+' somewhere else? Think of a new example that is different from the one in the lesson. Explain which part of the concept applies and why.\n\n'+tip,narration:'Understanding means more than remembering one example. You should be able to recognise the idea in a new situation and explain how to use it.',language:lang,activity:{prompt:'Which response shows real understanding?',options:['Use the concept correctly in a different situation and explain why it applies.','Repeat the lesson title without explaining it.','Memorise one example but cannot explain it.'],correct:0,feedback:'Exactly. Applying learning in a new context shows that you understand the idea.',tryAgain:'Think about the difference between repeating information and using it.'}},
   {stage:'recap',title:'10. Lesson recap: what can you now do?',body:'You have connected the topic to a familiar situation, explored the concept, learned important vocabulary, watched a teacher demonstration, practised with guidance and applied the method independently.\n\nRemember: '+tip+'\n\nYou are now ready for the classroom-style assessment.',narration:'Let us recap. You have learned what the concept means and, importantly, how to use it and answer questions about it. Remember: '+tip+'. You are ready to demonstrate your learning.',language:lang,keyPoint:tip}
  ];
 }
 function setNav(){

 function stopVoice(){try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll('.gm-audio').forEach(a=>{try{a.pause()}catch(e){}})}

  speechSynthesis.speak(u);
 };
 function renderPlayer(){
  if(!current)return;stopVoice();
  let c=current,slides=c.slides&&c.slides.length?c.slides:defaultSlides(c);
  playerIndex=Math.max(0,Math.min(playerIndex,slides.length-1));
  let s=slides[playerIndex],img=safe(s.imageUrl||c.imageUrl),video=safe(s.videoUrl||c.videoUrl);
  let activity=s.activity||null,actHtml='';
  if(activity&&activity.prompt){
   actHtml='<div class="gm-activity"><div class="gm-kicker">YOUR TURN</div><h3>'+esc(activity.prompt)+'</h3>'+
    (activity.options&&activity.options.length?activity.options.map((o,j)=>'<button class="gm-choice" onclick="gmCheckSlideAnswer('+j+')">'+esc(o)+'</button>').join(''):'<button class="btn light" onclick="document.getElementById(\'gm-reveal\').classList.toggle(\'hidden\')">Reveal a helpful hint</button><p id="gm-reveal" class="hidden">'+esc(activity.feedback||'Review the explanation and try again.')+'</p>')+
