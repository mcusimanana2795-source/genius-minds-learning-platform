<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b46"><meta name="description" content="Genius Minds concept learning, assessments and progress tracking"><title>Genius Minds | Learning Platform</title>
<style>
:root{--navy:#142b46;--gold:#d3aa58;--ink:#182b40;--muted:#68788a;--paper:#f3f6fa;--line:#e1e7ef;--white:#fff;--green:#16845b;--red:#b84343}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,Arial,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--navy);color:#fff;padding:24px 16px}.brand{display:flex;gap:12px;align-items:center;margin:0 6px 30px}.logo{background:var(--gold);color:var(--navy);font-weight:900;border-radius:12px;padding:12px;font-size:19px}.brand small{display:block;color:#cbd5df;font-size:10px;letter-spacing:1.6px}.nav button,.role{width:100%;border:0;background:transparent;color:#dbe4ed;padding:12px;text-align:left;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover,.role:hover{background:#29425e;color:#fff}.side .hint{font-size:12px;color:#c1cedb;margin:24px 8px}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:15px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:2}.top strong{font-size:14px}.top small{color:var(--muted)}.content{max-width:1200px;margin:auto;padding:28px}.welcome{background:linear-gradient(120deg,#142b46,#284866);color:white;border-radius:18px;padding:26px;margin-bottom:22px}.welcome h1{margin:0 0 6px;font-size:27px}.welcome p{margin:0;color:#e2eaf1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 12px #152b4608}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.stat{font-size:27px;font-weight:800;color:var(--navy)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn.gold{background:var(--gold);color:var(--navy)}.btn.light{background:#edf2f7;color:var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink)}label{display:block;font-weight:650;margin:12px 0 5px}.field{min-width:170px}.course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.course{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff;cursor:pointer}.course:hover{border-color:var(--gold);transform:translateY(-1px)}.tag{font-size:11px;font-weight:800;letter-spacing:.5px;color:#77571c;background:#fbf2dc;border-radius:20px;padding:4px 8px}.progress{height:8px;background:#e9eef3;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.concept{border-left:4px solid var(--gold);padding:3px 0 3px 14px;margin:18px 0}.example{background:#f6f8fb;border-radius:10px;padding:13px;margin:12px 0}.q{padding:15px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.q p{margin:0 0 8px;font-weight:650}.q label{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:7px 0}.q input[type=radio]{margin-top:5px}.feedback{border-radius:9px;padding:12px;margin:8px 0}.good{background:#e7f5ee;color:#145d40}.bad{background:#fff0ef;color:#8d2929}.notice{background:#fff8e8;border:1px solid #f0dfb8;padding:12px;border-radius:10px;margin:12px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f5f7fa;color:#46596d}.pill{border-radius:20px;padding:4px 8px;font-size:11px;font-weight:800;background:#e9f4ee;color:#176044}.pill.warn{background:#fff0df;color:#805018}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.hidden{display:none!important}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.score{font-size:36px;font-weight:900;color:var(--navy)}.footer{padding:20px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{padding:12px;position:static}.brand{margin-bottom:8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.side .hint{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:18px}.top{padding:12px 18px}}@media(max-width:560px){.grid,.course-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.welcome h1{font-size:22px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="logo">GM</div><div><b>GENIUS MINDS</b><small>LEARN • PRACTISE • MASTER</small></div></div><nav class="nav"><button class="active" data-view="home">⌂ &nbsp; Dashboard</button><button data-view="learn">▤ &nbsp; My learning</button><button data-view="results">✓ &nbsp; My results</button><button data-view="teacher">▦ &nbsp; Tutor dashboard</button><button data-view="settings">⚙ &nbsp; Settings</button></nav><p class="hint">Every concept ends with an assessment. Mastery is earned through demonstrated understanding.</p></aside><main class="main"><header class="top"><div><strong id="pageTitle">Learner dashboard</strong><br><small>Genius Minds Tutoring • South Africa</small></div><div class="row"><label for="learner" class="small">Learner profile</label><input id="learner" class="field" value="Demo Learner" aria-label="Learner name"><select id="role" aria-label="View role"><option value="learner">Learner view</option><option value="teacher">Tutor / admin view</option></select></div></header><div class="content" id="app"></div><div class="footer">Genius Minds • Learning data in this demonstration is stored in this browser on this device.</div></main></div>
<script>
const courses=[
{grade:3,subject:'Afrikaans FAL',term:1,concepts:[['Selfstandige naamwoorde','A noun names a person, place, animal or thing.','meisie, skool, hond, boek','Find the naming words in a sentence.'],['Werkwoorde','A verb tells us what someone or something does.','hardloop, lees, skryf, sing','Look for the action word.']]},
{grade:3,subject:'English',term:1,concepts:[['Nouns','A noun is the name of a person, place, animal or thing.','teacher, park, cat, pencil','A proper noun names a specific person or place and begins with a capital letter.'],['Pronouns','A pronoun takes the place of a noun.','he, she, it, they, we','Use a pronoun to avoid repeating a name.'],['Verbs','A verb tells what someone or something does or is.','jump, read, is, are','Find the action or being word.']]},
{grade:4,subject:'Natural Sciences',term:1,concepts:[['Living and non-living things','Living things carry out life processes. Non-living things do not.','A plant grows; a stone does not.','Living things need energy and can grow and reproduce.'],['Life processes','Living things carry out processes such as nutrition, respiration, growth and reproduction.','A seed germinates and grows into a plant.','Use evidence to decide whether something is living.']]},
{grade:5,subject:'Afrikaans FAL',term:1,concepts:[['Meervoude','A plural tells us there is more than one.','boek – boeke; hond – honde','Notice how the word ending changes.'],['Teenoorgesteldes','Opposites have contrasting meanings.','warm – koud; groot – klein','Choose a word with the opposite meaning.']]},
{grade:5,subject:'Life Skills',term:1,concepts:[['Self-concept','Self-concept is how you see and understand yourself.','Your strengths, interests and values.','A healthy self-concept includes recognising strengths and areas to improve.']]},
{grade:7,subject:'Afrikaans FAL',term:1,concepts:[['Byvoeglike naamwoorde','An adjective describes a noun.','Die pragtige blom; ’n vinnige motor.','Adjectives add detail and can appear before or after a noun.'],['Ontkenning','Negative form changes a statement into a negative sentence.','Ek eet brood. → Ek eet nie brood nie.','In Afrikaans, nie ... nie is commonly used around the relevant sentence part.']]},
{grade:7,subject:'Natural Sciences',term:1,concepts:[['Photosynthesis','Plants use light energy to make glucose from carbon dioxide and water, releasing oxygen.','Light + water + carbon dioxide → glucose + oxygen.','Chlorophyll in green leaves absorbs light energy.'],['Food chains','A food chain shows how energy moves between organisms.','Grass → grasshopper → frog → snake.','Arrows point in the direction energy is transferred.']]},
{grade:7,subject:'EMS',term:1,concepts:[['Needs and wants','Needs are essentials for living; wants are things people would like to have.','Food is a need; a new game is usually a want.','Limited resources mean choices must be made.']]},
{grade:7,subject:'Technology',term:1,concepts:[['The design process','The design process includes investigating, designing, making, evaluating and communicating.','A learner investigates a problem before designing a solution.','Testing and improving are important parts of the process.']]}
];
const storeKey='gm_assessment_v2';let db=load();let current=null,attempt=0,questions=[],answers={},lastResult=null;
function load(){try{return JSON.parse(localStorage.getItem(storeKey))||{attempts:[],mastery:{},threshold:70,scale:[{min:80,grade:'A',label:'Excellent'},{min:70,grade:'B',label:'Good'},{min:60,grade:'C',label:'Satisfactory'},{min:50,grade:'D',label:'Basic'},{min:0,grade:'E',label:'Needs support'}]}}catch(e){return{attempts:[],mastery:{},threshold:70,scale:[{min:80,grade:'A'},{min:70,grade:'B'},{min:60,grade:'C'},{min:50,grade:'D'},{min:0,grade:'E'}]}}}
function save(){localStorage.setItem(storeKey,JSON.stringify(db))}
function who(){return document.getElementById('learner').value.trim()||'Demo Learner'}
function key(c){return [c.grade,c.subject,c.term,c.concept].join('|')}
function concepts(){return courses.flatMap(c=>c.concepts.map(x=>({grade:c.grade,subject:c.subject,term:c.term,concept:x[0],explain:x[1],examples:x[2],tip:x[3]})))}
function resultFor(c){return db.attempts.filter(a=>a.learner===who()&&a.key===key(c))}
function best(c){let a=resultFor(c);return a.length?Math.max(...a.map(x=>x.percent)):null}
function latest(c){let a=resultFor(c);return a.length?a[a.length-1]:null}
function grade(p){return (db.scale||[]).slice().sort((a,b)=>b.min-a.min).find(x=>p>=x.min)?.grade||'E'}
function mastered(c){return best(c)!==null&&best(c)>=db.threshold}
function view(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.getElementById('pageTitle').textContent=({home:'Learner dashboard',learn:'My learning',results:'My assessment results',teacher:'Tutor and administrator dashboard',settings:'Assessment settings'})[name];({home:home,learn:learn,results:results,teacher:teacher,settings:settings}[name]||home)()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>view(b.dataset.view));document.getElementById('role').onchange=e=>view(e.target.value==='teacher'?'teacher':'home');document.getElementById('learner').onchange=()=>view('home');
function home(){let cs=concepts(),done=cs.filter(c=>latest(c)).length,mas=cs.filter(mastered).length,avg=done?Math.round(cs.filter(c=>latest(c)).reduce((s,c)=>s+latest(c).percent,0)/done):0;app.innerHTML=`<section class="welcome"><h1>Welcome to Genius Minds</h1><p>Learn each concept, practise with purpose and prove what you know.</p></section><div class="grid"><div class="card"><div class="muted">Concepts assessed</div><div class="stat">${done}/${cs.length}</div></div><div class="card"><div class="muted">Concepts mastered</div><div class="stat">${mas}</div></div><div class="card"><div class="muted">Latest-result average</div><div class="stat">${avg}%</div></div></div><div class="row" style="margin:24px 0 12px"><h2>Continue learning</h2><button class="btn gold" onclick="view('learn')">Browse concepts</button></div><div class="course-grid">${cs.slice(0,6).map(c=>courseCard(c)).join('')}</div>`}
function courseCard(c){let l=latest(c),b=best(c);return `<div class="course" onclick="openConcept('${encodeURIComponent(key(c))}')"><div class="row"><span class="tag">GRADE ${c.grade} • TERM ${c.term}</span><span class="pill ${mastered(c)?'':'warn'}">${mastered(c)?'MASTERED':l?'IN PROGRESS':'NOT ATTEMPTED'}</span></div><h3 style="margin:12px 0 2px">${c.concept}</h3><div class="muted small">${c.subject}</div><p class="small muted">${c.explain}</p><div class="row small"><span>${l?'Latest: '+l.percent+'%':'Assessment required'}</span><span>${b!==null?'Best: '+b+'%':''}</span></div></div>`}
function learn(){app.innerHTML=`<div class="row"><div><h2>Learning library</h2><p class="muted">Choose a grade, subject and concept. Every concept has its own assessment.</p></div><div class="actions"><select id="gradeFilter" onchange="filterCourses()"><option value="">All grades</option>${[3,4,5,7].map(n=>`<option>${n}</option>`).join('')}</select><select id="subjectFilter" onchange="filterCourses()"><option value="">All subjects</option>${[...new Set(courses.map(c=>c.subject))].map(s=>`<option>${s}</option>`).join('')}</select></div></div><div id="courseList" class="course-grid">${concepts().map(courseCard).join('')}</div>`}
function filterCourses(){let g=document.getElementById('gradeFilter').value,s=document.getElementById('subjectFilter').value;document.getElementById('courseList').innerHTML=concepts().filter(c=>(!g||c.grade==g)&&(!s||c.subject===s)).map(courseCard).join('')}
function openConcept(encoded){let k=decodeURIComponent(encoded);current=concepts().find(c=>key(c)===k);if(!current)return;renderLesson()}
function speak(text){if(!('speechSynthesis'in window)){alert('Voice narration is not supported by this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-ZA';u.rate=.88;speechSynthesis.speak(u)}
function renderLesson(){let c=current;app.innerHTML=`<button class="btn light" onclick="view('learn')">← Back to learning library</button><div class="welcome" style="margin-top:16px"><span class="tag">GRADE ${c.grade} • ${c.subject} • TERM ${c.term}</span><h1>${c.concept}</h1><p>Study the explanation and examples, then complete the concept assessment.</p></div><div class="card"><div class="row"><h2>1. Understand the concept</h2><button class="btn gold" onclick="speak(document.getElementById('lessonText').innerText)">🔊 Listen to lesson</button></div><div id="lessonText"><p>${c.explain}</p><div class="example"><b>Examples</b><br>${c.examples}</div><div class="concept"><b>Remember</b><br>${c.tip}</div></div><div class="notice">Work through the examples carefully. The assessment below checks this concept specifically.</div><h3>2. Quick practice</h3><p>Explain the concept aloud in your own words. Then identify one new example from your everyday life.</p><textarea id="practiceNote" rows="2" placeholder="Write your own example here (optional)"></textarea><div class="row" style="margin-top:16px"><div><b>3. Ready to demonstrate mastery?</b><div class="muted small">Your assessment uses a fresh question order and may use alternative questions on retakes.</div></div><button class="btn gold" onclick="startTest()">Start concept assessment →</button></div></div>`}
function bank(c,variant){let name=c.concept.toLowerCase(),ex=c.examples,first=ex.split(/[;,]/)[0].trim();let base=[
{type:'mcq',q:'Which statement best describes '+c.concept+'?',opts:[c.explain,'It is unrelated to this subject.','It is a word with no meaning.'],a:0,why:c.explain},
{type:'tf',q:'The following is an important idea in this concept: '+c.tip,trueA:true,why:c.tip},
{type:'fill',q:'Give one example from the lesson: '+ex.split(/[;,]/)[0],a:[first.toLowerCase()],why:'One example from the lesson is '+first+'.'},
{type:'match',q:'Match the idea to the description.',pairs:[['Concept','The idea being studied'],['Example','A specific illustration'],['Explanation','Why or how it works']],why:'A concept is the idea, an example illustrates it, and an explanation describes it.'},
{type:'mcq',q:'Which is the best way to show that you understand '+c.concept+'?',opts:['Give a correct example and explain why it fits.','Repeat the heading only.','Skip the activity.'],a:0,why:'Understanding means you can apply the idea and explain your thinking.'},
{type:'fill',q:'Complete this sentence: One important point to remember is ________. (Use a key word from the lesson.)',a:[c.concept.toLowerCase(),...c.tip.toLowerCase().split(' ').filter(w=>w.length>5).slice(0,2)],why:c.tip},
{type:'written',q:'In your own words, explain '+c.concept+' and give one example.',why:'A good answer explains the key idea and includes a relevant example.'},
{type:'mcq',q:'If you are unsure about an answer, what should you do?',opts:['Review the explanation and examples.','Guess without reading.','Move on without checking.'],a:0,why:'Revisit the lesson and use the examples to strengthen understanding.'}
];if(variant%2){base[0].opts=['A correct explanation supported by an example.','A random guess.','A copied heading without meaning.'];base[0].a=0;base[2].q='Choose one valid example from the lesson: '+ex;base[2].a=[first.toLowerCase()];base[4].q='What demonstrates real understanding of '+c.concept+'?'}return base}
function startTest(){attempt=resultFor(current).length;questions=current.assessment&&current.assessment.length?current.assessment:bank(current,attempt);answers={};renderTest()}
function renderTest(){let c=current;app.innerHTML=`<button class="btn light" onclick="renderLesson()">← Back to lesson</button><div class="row" style="margin:15px 0"><div><h2>${c.concept} – Assessment</h2><p class="muted">Grade ${c.grade} ${c.subject} • Term ${c.term} • Attempt ${attempt+1}</p></div><span class="tag">${questions.length} QUESTIONS • ${questions.reduce((n,q)=>n+(q.type==='match'?3:1),0)} MARKS</span></div><div class="notice">Answer every question. Objective questions are marked automatically. Written answers are flagged for tutor review and are not given an invented final mark.</div><form id="testForm">${questions.map((q,i)=>questionHTML(q,i)).join('')}<button class="btn gold" type="submit">Submit assessment</button></form>`;document.getElementById('testForm').onsubmit=e=>{e.preventDefault();submitTest()}}
function questionHTML(q,i){let html='';if(q.type==='mcq')html=q.opts.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('');if(q.type==='tf')html=`<label><input type="radio" name="q${i}" value="true"> True</label><label><input type="radio" name="q${i}" value="false"> False</label>`;if(q.type==='fill')html=`<input style="width:100%" name="q${i}" placeholder="Type your answer">`;if(q.type==='match')html=q.pairs.map((p,j)=>`<label>${p[0]} <select name="q${i}_${j}"><option value="">Choose a match</option>${q.pairs.map((x,k)=>`<option value="${k}">${x[1]}</option>`).join('')}</select></label>`).join('');if(q.type==='written')html=`<textarea name="q${i}" rows="3" style="width:100%" placeholder="Write your answer in your own words"></textarea>`;return `<div class="q"><p>${i+1}. ${q.q}</p><div class="muted small">${q.type==='written'?'Written response • Tutor review':q.type==='match'?'Matching • 3 marks':q.type==='fill'?'Fill in the blank • 1 mark':'Select the best answer • 1 mark'}</div>${html}</div>`}
function submitTest(){let score=0,max=0,review=[],detail=[];questions.forEach((q,i)=>{if(q.type==='written'){let val=document.querySelector('[name="q'+i+'"]').value.trim();review.push({question:q.q,answer:val,reason:q.why});detail.push({q:q.q,correct:null,explain:q.why,answer:val,review:true});return}let ok=false,answer='';if(q.type==='mcq'){max++;let v=document.querySelector('[name="q'+i+'"]:checked')?.value;answer=v===undefined?'No answer':q.opts[+v];ok=+v===q.a}if(q.type==='tf'){max++;let v=document.querySelector('[name="q'+i+'"]:checked')?.value;answer=v||'No answer';ok=(v==='true')===q.trueA}if(q.type==='fill'){max++;let v=document.querySelector('[name="q'+i+'"]').value.trim();answer=v||'No answer';ok=q.a.some(a=>a.toLowerCase()===v.toLowerCase())}if(q.type==='match'){max+=3;let n=0;answer=q.pairs.map((p,j)=>{let v=document.querySelector('[name="q'+i+'_'+j+'"]').value;if(+v===j)n++;return p[0]+': '+(v===''?'Not answered':q.pairs[+v]?.[1]||'')}).join('; ');score+=n;ok=n===3;detail.push({q:q.q,correct:ok,mark:n+'/'+3,explain:q.why,answer});return}if(ok)score++;detail.push({q:q.q,correct:ok,mark:ok?'1/1':'0/1',explain:q.why,answer})});let percent=Math.round(score/max*100),needsReview=review.length>0;let record={learner:who(),key:key(current),grade:current.grade,subject:current.subject,term:current.term,concept:current.concept,score,max,percent,gradeBand:grade(percent),date:new Date().toISOString(),attempt:attempt+1,needsReview,review,detail};db.attempts.push(record);if(!db.mastery[key(current)])db.mastery[key(current)]={};db.mastery[key(current)].mastered=percent>=db.threshold;save();lastResult=record;renderResult(record)}
function renderResult(r){let prev=resultFor(current).filter(a=>a.attempt<r.attempt).slice(-2)[0];app.innerHTML=`<div class="welcome"><span class="tag">ASSESSMENT COMPLETE</span><h1>${r.concept} – Your results</h1><p>${r.needsReview?'Objective mark shown below; written response awaits tutor review.':'Your assessment has been marked automatically.'}</p></div><div class="grid"><div class="card"><div class="muted">Objective score</div><div class="score">${r.score}/${r.max}</div></div><div class="card"><div class="muted">Percentage</div><div class="score">${r.percent}%</div></div><div class="card"><div class="muted">Achievement grade</div><div class="score">${r.gradeBand}</div></div></div><div class="card" style="margin-top:16px"><h2>${r.percent>=db.threshold?'Well done!':'Keep practising – you can improve.'}</h2><p>${r.percent>=db.threshold?'You have reached the current mastery threshold for this concept.':'You have not reached the mastery threshold of '+db.threshold+'%. Revisit the lesson, listen to the explanation and try another assessment.'}</p>${prev?'<p class="muted">Previous attempt: '+prev.percent+'% • Change: '+(r.percent-prev.percent)+' percentage points.</p>':''}<div class="progress"><span style="width:${r.percent}%"></span></div><h3>Question feedback</h3>${r.detail.map((d,i)=>`<div class="feedback ${d.review?'':' '+(d.correct?'good':'bad')+' '}"><b>${i+1}. ${d.q}</b><br>${d.review?'Tutor review required.':d.correct?'Correct – '+d.mark:'Review this answer – '+d.mark}<br><span class="small">${d.explain}</span></div>`).join('')}${r.review.length?'<div class="notice"><b>Written response pending:</b> '+r.review.map(x=>x.answer||'No response').join('; ')+'. A tutor must review this answer before a final written mark is assigned.</div>':''}<div class="actions"><button class="btn gold" onclick="startTest()">Try a new assessment</button><button class="btn light" onclick="renderLesson()">Revise lesson</button><button class="btn light" onclick="view('results')">View all results</button></div></div>`}
function results(){let cs=concepts();app.innerHTML=`<h2>My concept results</h2><p class="muted">Latest and best results for each concept. A concept is mastered only when the best score reaches ${db.threshold}%.</p><div class="table-wrap card"><table><thead><tr><th>Grade / Subject / Term</th><th>Concept</th><th>Latest</th><th>Best</th><th>Attempts</th><th>Status</th></tr></thead><tbody>${cs.map(c=>{let a=resultFor(c),l=latest(c),b=best(c);return `<tr><td>Gr ${c.grade} • ${c.subject} • T${c.term}</td><td>${c.concept}</td><td>${l?l.score+'/'+l.max+' ('+l.percent+'%)':'—'}</td><td>${b===null?'—':b+'%'}</td><td>${a.length}</td><td>${mastered(c)?'<span class="pill">Mastered</span>':l?'<span class="pill warn">Revise</span>':'Not attempted'}</td></tr>`}).join('')}</tbody></table></div>`}

   '<div><label>Subject</label><input id="gm-subject" list="gm-subject-list" style="width:100%" value="'+esc(c?.subject||'')+'" placeholder="Choose or type a subject"><datalist id="gm-subject-list">'+subjects.map(x=>'<option value="'+x+'">').join('')+'</datalist></div>'+
   '<div><label>Term</label><select id="gm-term">'+[1,2,3,4].map(n=>'<option '+(c?.term===n?'selected':'')+'>'+n+'</option>').join('')+'</select></div>'+

   '<div class="actions" style="margin-top:18px"><button class="btn gold" id="gm-save">'+(c?'Save changes':'Publish lesson to learning library')+'</button><button class="btn light" id="gm-preview-draft">Preview presentation</button>'+(c?'<button class="btn light" id="gm-cancel">Cancel</button>':'')+'</div></div>'+
   '<div class="row" style="margin-top:24px"><h2>Your interactive lessons</h2><span class="muted small">'+d.customCourses.length+' created</span></div>'+(list||'<div class="notice">Your created lessons will appear here.</div>');
  $('gm-add-slide').onclick=()=>{let draft=collectSlides();draft.push({title:'New slide',body:'',narration:'',language:'en-ZA'});$('gm-slide-list').innerHTML=draft.map(slideEditor).join('');bindSlideRemovers()};

   if(assessment.some(q=>!q.q||q.opts.length<2||q.a<0||q.a>=q.opts.length))return alert('Each assessment question needs a prompt, at least two options and a valid correct answer.');

   let item={id:c?.id||('gm_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)),grade:+$('gm-grade').value,subject:$('gm-subject').value.trim(),term:+$('gm-term').value,concept:$('gm-title').value.trim(),explain:slideData.map(x=>x.body).filter(Boolean).join('\n\n'),examples:slideData.map(x=>x.examples).filter(Boolean).join('; '),tip:slideData.map(x=>x.keyPoint).filter(Boolean).join('; '),slides:slideData,assessment};

  };

  document.querySelectorAll('[data-gm-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this lesson? Existing assessment results will remain.'))return;let data=readDB();data.customCourses=(data.customCourses||[]).filter(x=>x.id!==b.dataset.gmDelete);writeDB(data);renderStudio()});
  document.querySelectorAll('[data-gm-preview]').forEach(b=>b.onclick=()=>{let x=readDB().customCourses.find(y=>y.id===b.dataset.gmPreview);if(x){current=x;playerIndex=0;renderPlayer()}});
 }
 let priorView=window.view;
 window.view=function(v){

 };
