<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142b46"><meta name="description" content="Genius Minds Tutoring interactive learning platform">
<title>Genius Minds | Learning Platform</title>
<style>
:root{--navy:#142b46;--gold:#d3aa58;--ink:#182b40;--muted:#68788a;--paper:#f4f6f9;--line:#e3e9ef;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px Arial,sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:var(--navy);color:white;padding:24px 16px;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;margin:0 6px 28px;color:white;text-decoration:none}.mark{background:var(--gold);color:var(--navy);font-weight:900;border-radius:12px;padding:13px}.brand small{display:block;color:#c8d3df;font-size:10px;letter-spacing:1.5px;margin-top:4px}.nav button,.role{display:block;width:100%;padding:13px;border:0;border-radius:9px;background:transparent;color:#d9e2eb;text-align:left;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover,.role:hover{background:#ffffff20;color:white}.side-foot{margin-top:auto;color:#c8d3df;font-size:12px;line-height:1.5}.main{min-width:0}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.top span{color:var(--muted);font-size:13px}.content{max-width:1200px;margin:auto;padding:30px}.eyebrow{color:#9b742d;text-transform:uppercase;font-size:11px;font-weight:bold;letter-spacing:1.5px}h1{font-size:29px;margin:8px 0}h2{font-size:20px;margin:0 0 12px}p{line-height:1.6}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 3px 12px #142b4608}.course{cursor:pointer;transition:.15s}.course:hover{transform:translateY(-2px);border-color:var(--gold)}.tag{font-size:11px;color:#8b6729;background:#f8f1e5;padding:6px 9px;border-radius:20px;display:inline-block}.btn{border:0;border-radius:9px;background:var(--navy);color:white;padding:11px 15px;font-weight:bold;cursor:pointer;margin:4px 4px 4px 0}.btn.gold{background:var(--gold);color:var(--navy)}.btn.light{background:#edf1f5;color:var(--navy)}.btn:disabled{opacity:.4;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.stat strong{display:block;font-size:27px;margin:8px 0}.bar{height:8px;background:#edf1f5;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.lesson-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.topic{display:block;width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);background:white;text-align:left;cursor:pointer}.topic.active{color:#936b23;font-weight:bold;background:#fbf8f1}.answer{display:block;padding:12px;border:1px solid var(--line);border-radius:9px;margin:9px 0;cursor:pointer}.answer:has(input:checked){border-color:var(--gold);background:#fffaf0}input{accent-color:var(--navy)}.hide{display:none}.notice{padding:12px;background:#f8f1e5;border-radius:10px;margin:12px 0}.footer{text-align:center;color:#8894a1;font-size:11px;padding:18px;border-top:1px solid var(--line)}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{padding:14px;position:static}.brand{margin-bottom:12px}.nav{display:flex;flex-wrap:wrap}.nav button{width:auto;padding:9px}.side-foot{display:none}.grid{grid-template-columns:repeat(2,1fr)}.lesson-layout{grid-template-columns:1fr}.top{padding:0 18px}.content{padding:20px}}@media(max-width:560px){.grid,.stats{grid-template-columns:1fr}.content{padding:16px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="layout">
<aside class="side"><a class="brand" href="#" onclick="go('home');return false"><span class="mark">GM</span><span><b>GENIUS MINDS</b><small>LEARNING PLATFORM</small></span></a>
<nav class="nav"><button class="active" data-page="home">⌂ &nbsp; Dashboard</button><button data-page="learn">▤ &nbsp; My learning</button><button data-page="progress">▥ &nbsp; My progress</button><button data-page="tutor">✚ &nbsp; Tutor area</button></nav>
<div class="side-foot">Learn. Understand. Achieve.<br>Small steps every day lead to big achievements.</div></aside>
<main class="main"><header class="top"><b id="crumb">My learning space / Dashboard</b><span id="date"></span></header><section class="content" id="view"></section><footer class="footer">GENIUS MINDS TUTORING · LEARN. UNDERSTAND. ACHIEVE.</footer></main>
</div>
<script>
const courses=[
{grade:'Grade 3',subject:'Afrikaans FAL',term:'Term 1',topics:[{title:'Groete en bekendstellings',parts:[['Groetwoorde','Ons gebruik groetwoorde wanneer ons iemand ontmoet. Sê “Goeiemôre” in die oggend en “Goeienaand” in die aand.','Goeiemôre = Good morning. Hallo = Hello.'],['Stel jouself bekend','Sê jou naam wanneer jy jouself bekendstel. Gebruik: “My naam is …”','My naam is Ana. = My name is Ana.']],quiz:[['Wat beteken “Goeiemôre”?',['Good night','Good morning','Goodbye'],1,'“Goeiemôre” beteken Good morning.'],['Hoe stel jy jouself bekend?',['My naam is …','Totsiens','Dankie'],0,'Gebruik “My naam is …” om jou naam te sê.']]},{title:'Liggaamsdele',parts:[['Woorde vir liggaamsdele','Ons het verskillende liggaamsdele. Ons sien met ons oë, hoor met ons ore en loop met ons bene.','Oë = eyes; ore = ears; neus = nose; hande = hands.']],quiz:[['Waarmee hoor ons?',['Oë','Ore','Voete'],1,'Ons hoor met ons ore.']]}]},
{grade:'Grade 4',subject:'Natural Sciences',term:'Term 1',topics:[{title:'Living and non-living things',parts:[['What makes something living?','Living things carry out life processes. They need energy, grow, respond to their surroundings and reproduce.','A plant is living because it grows and needs water and sunlight. A rock is non-living.'],['Seven life processes','The seven life processes are movement, respiration, sensitivity, growth, reproduction, excretion and nutrition.','Remember MRS GREN: Movement, Respiration, Sensitivity, Growth, Reproduction, Excretion, Nutrition.']],quiz:[['Which is a living thing?',['A stone','A growing plant','A plastic ruler'],1,'A growing plant carries out life processes.'],['What does the N in MRS GREN stand for?',['Nutrition','Noise','Nature'],0,'N stands for nutrition.']]},{title:'The water cycle',parts:[['How water moves','The sun heats water and causes evaporation. Water vapour cools and condenses into clouds. Water falls as precipitation.','Evaporation → condensation → precipitation → collection.']],quiz:[['What causes evaporation?',['Cooling','Heating by the sun','Freezing'],1,'Heat from the sun causes water to evaporate.']]}]},
{grade:'Grade 5',subject:'Afrikaans FAL',term:'Term 1',topics:[{title:'Selfstandige naamwoorde',parts:[['Wat is dit?','’n Selfstandige naamwoord is die naam van ’n mens, plek, dier of ding.','meisie, skool, hond, boek.'],['Soek die naamwoord','Lees ’n sin en vra: Wie of wat? Die antwoord kan ’n selfstandige naamwoord wees.','Die hond slaap. “Hond” is die naamwoord.']],quiz:[['Watter woord is ’n selfstandige naamwoord?',['hardloop','mooi','skool'],2,'“Skool” is die naam van ’n plek.']]},{title:'Teenoorgesteldes',parts:[['Antonieme','Teenoorgesteldes is woorde met die teenoorgestelde betekenis.','groot ↔ klein; warm ↔ koud; vinnig ↔ stadig.']],quiz:[['Wat is die teenoorgestelde van “warm”?',['koud','hoog','sag'],0,'Die teenoorgestelde van warm is koud.']]}]},
{grade:'Grade 5',subject:'Life Skills',term:'Term 1',topics:[{title:'Self-concept and strengths',parts:[['Understanding yourself','Self-concept is the way you see and think about yourself. Everyone has strengths and areas where they can improve.','A strength could be helping others, drawing, reading or solving problems.']],quiz:[['What is a strength?',['Something you can do well','A mistake','A punishment'],0,'A strength is something you can do well.']]}]},
{grade:'Grade 7',subject:'Afrikaans FAL',term:'Term 1',topics:[{title:'Woordsoorte',parts:[['Selfstandige naamwoorde','Selfstandige naamwoorde benoem mense, plekke, diere en dinge.','Die leerder lees ’n boek. “Leerder” en “boek” is selfstandige naamwoorde.'],['Werkwoorde','Werkwoorde beskryf aksies of handelinge.','Die meisie hardloop. “Hardloop” is die werkwoord.']],quiz:[['Identifiseer die werkwoord: “Die seun speel buite.”',['seun','speel','buite'],1,'“Speel” beskryf die aksie.']]},{title:'Sinonieme en antonieme',parts:[['Sinonieme','Sinonieme is woorde met dieselfde of byna dieselfde betekenis.','bly = gelukkig; mooi = pragtig.'],['Antonieme','Antonieme is woorde met teenoorgestelde betekenisse.','donker ↔ lig; vroeg ↔ laat.']],quiz:[['Wat is ’n antoniem vir “vroeg”?',['laat','gou','nou'],0,'Die antoniem van vroeg is laat.']]}]},
{grade:'Grade 7',subject:'Natural Sciences',term:'Term 1',topics:[{title:'Photosynthesis',parts:[['How plants make food','Photosynthesis is the process in which green plants use light energy to make food from water and carbon dioxide. Oxygen is released.','Plants need sunlight, water, carbon dioxide and chlorophyll.']],quiz:[['Which gas do plants take in for photosynthesis?',['Oxygen','Carbon dioxide','Nitrogen'],1,'Plants take in carbon dioxide.']]},{title:'Electrical circuits',parts:[['A complete circuit','An electrical circuit needs a power source, conducting wires and a device such as a bulb. The circuit must be closed for current to flow.','An open switch breaks the circuit. A closed switch completes it.']],quiz:[['When does current flow?',['When the circuit is closed','When a wire is broken','When the switch is open'],0,'A closed circuit provides a complete path.']]}]},
{grade:'Grade 7',subject:'EMS',term:'Term 1',topics:[{title:'Needs and wants',parts:[['Needs','Needs are things people must have to survive, such as food, clean water, shelter and basic clothing.','A want is something desirable but not essential, such as a new game.']],quiz:[['Which is a basic need?',['A video game','Clean water','Designer shoes'],1,'Clean water is necessary for survival.']]},{title:'Entrepreneurs',parts:[['Starting a business','An entrepreneur identifies an opportunity, takes a calculated risk and organises resources to start a business.','A person who starts a small baking business is an entrepreneur.']],quiz:[['What does an entrepreneur do?',['Starts and manages a business','Only spends money','Avoids all decisions'],0,'Entrepreneurs organise resources and take business risks.']]}]},
{grade:'Grade 7',subject:'Technology',term:'Term 1',topics:[{title:'The design process',parts:[['Steps in designing','The design process includes investigating a problem, designing a solution, making a model, evaluating it and communicating results.','Investigate → Design → Make → Evaluate → Communicate.']],quiz:[['What should happen first?',['Evaluate','Investigate the problem','Decorate the model'],1,'First investigate and understand the problem.']]},{title:'Mechanical systems: levers',parts:[['How a lever works','A lever is a rigid bar that turns around a fixed point called a fulcrum. It helps move a load using an effort.','A seesaw and a crowbar are examples of levers.']],quiz:[['What is the fixed turning point called?',['Load','Effort','Fulcrum'],2,'The fixed turning point is the fulcrum.']]}}
];
let data=JSON.parse(localStorage.getItem('gm-progress')||'{}'),page='home',selected=0,topicIndex=0,partIndex=0;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('gm-progress',JSON.stringify(data))}
function doneKey(c,t){return c.grade+'|'+c.subject+'|'+t.title}
function isDone(c,t){return !!data[doneKey(c,t)]}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function render(){let v=$('#view');$('#crumb').textContent='My learning space / '+({home:'Dashboard',learn:'My learning',progress:'My progress',tutor:'Tutor area'}[page]);if(page==='home')home(v);if(page==='learn')learning(v);if(page==='progress')progress(v);if(page==='tutor')tutor(v)}
function home(v){let total=courses.reduce((n,c)=>n+c.topics.length,0),complete=courses.reduce((n,c)=>n+c.topics.filter(t=>isDone(c,t)).length,0);v.innerHTML='<div class="eyebrow">Welcome to your learning space</div><h1>Learn something new today.</h1><p class="muted">Choose a subject, work through the lesson and test what you understand.</p><div class="stats"><div class="card stat"><span class="muted">Available topics</span><strong>'+total+'</strong><small class="muted">Starter learning library</small></div><div class="card stat"><span class="muted">Topics completed</span><strong>'+complete+'</strong><small class="muted">Saved on this device</small></div><div class="card stat"><span class="muted">Overall progress</span><strong>'+Math.round(complete/total*100)+'%</strong><div class="bar"><i style="width:'+(complete/total*100)+'%"></i></div></div></div><h2>Explore your subjects</h2><div class="grid">'+courses.map((c,i)=>'<article class="card course" onclick="openCourse('+i+')"><span class="tag">'+c.grade+'</span><h2 style="margin-top:14px">'+esc(c.subject)+'</h2><p class="muted">'+c.term+' · '+c.topics.length+' starter topics</p><div class="bar"><i style="width:'+(c.topics.filter(t=>isDone(c,t)).length/c.topics.length*100)+'%"></i></div><p><b>'+c.topics.filter(t=>isDone(c,t)).length+'</b> of '+c.topics.length+' completed</p><button class="btn light">Open subject →</button></article>').join('')+'</div>'}
function openCourse(i){selected=i;topicIndex=0;partIndex=0;page='lesson';renderLesson()}
function learning(v){v.innerHTML='<div class="eyebrow">Curriculum library</div><h1>My learning</h1><p class="muted">Select a grade and subject to open its lessons.</p><div class="grid">'+courses.map((c,i)=>'<article class="card course" onclick="openCourse('+i+')"><span class="tag">'+c.grade+'</span><h2 style="margin-top:12px">'+esc(c.subject)+'</h2><p class="muted">'+c.term+' · '+c.topics.length+' topics</p><button class="btn">View lessons</button></article>').join('')+'</div>'}
function renderLesson(){let c=courses[selected],t=c.topics[topicIndex],p=t.parts[partIndex],v=$('#view');$('#crumb').textContent='My learning space / '+c.grade+' '+c.subject;v.innerHTML='<button class="btn light" onclick="go(\'learn\')">← All subjects</button><div class="lesson-layout" style="margin-top:15px"><div class="panel"><span class="tag">'+c.grade+' · '+c.subject+'</span><h2 style="margin-top:15px">Topics</h2>'+c.topics.map((x,i)=>'<button class="topic '+(i===topicIndex?'active':'')+'" onclick="topicIndex='+i+';partIndex=0;renderLesson()">'+(isDone(c,x)?'✓ ':'')+esc(x.title)+'</button>').join('')+'</div><div class="panel"><div class="eyebrow">Lesson '+(partIndex+1)+' of '+t.parts.length+'</div><h1>'+esc(t.title)+'</h1><h2>'+esc(p[0])+'</h2><p>'+esc(p[1])+'</p><div class="notice"><b>Example:</b><br>'+esc(p[2])+'</div><div><button class="btn light" onclick="speak()">🔊 Listen</button><button class="btn light" onclick="speechSynthesis.cancel()">■ Stop voice</button><button class="btn light" onclick="alert('+JSON.stringify(p[2]).replace(/</g,'\\u003c')+')">Show example</button></div><div style="margin-top:22px">'+(partIndex>0?'<button class="btn light" onclick="partIndex--;renderLesson()">Previous</button>':'')+(partIndex<t.parts.length-1?'<button class="btn" onclick="partIndex++;renderLesson()">Next lesson section →</button>':'<button class="btn gold" onclick="startQuiz()">Start topic assessment →</button>')+'</div></div></div>'}
function speak(){let c=courses[selected],p=c.topics[topicIndex].parts[partIndex],u=new SpeechSynthesisUtterance(p[0]+'. '+p[1]+'. Example. '+p[2]);let voices=speechSynthesis.getVoices();u.voice=voices.find(x=>x.lang.toLowerCase().startsWith('en-za'))||voices.find(x=>x.lang.toLowerCase().startsWith('en'))||null;speechSynthesis.cancel();speechSynthesis.speak(u)}
function startQuiz(){let c=courses[selected],t=c.topics[topicIndex],v=$('#view');v.innerHTML='<button class="btn light" onclick="renderLesson()">← Back to lesson</button><div class="panel" style="margin-top:15px"><div class="eyebrow">Independent assessment</div><h1>'+esc(t.title)+'</h1><p class="muted">Answer each question. Your result and feedback will appear when you submit.</p><form id="quiz">'+t.quiz.map((q,i)=>'<div style="margin:22px 0"><h2>'+(i+1)+'. '+esc(q[0])+'</h2>'+q[1].map((a,j)=>'<label class="answer"><input type="radio" name="q'+i+'" value="'+j+'" required> '+esc(a)+'</label>').join('')+'</div>').join('')+'<button class="btn gold">Submit assessment</button></form><div id="result"></div></div>';$('#quiz').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),score=0,feedback=t.quiz.map((q,i)=>{let chosen=Number(fd.get('q'+i)),ok=chosen===q[2];if(ok)score++;return '<p><b>'+(ok?'Correct':'Review')+':</b> '+esc(q[3])+'</p>'}).join('');let percent=Math.round(score/t.quiz.length*100);data[doneKey(c,t)]={score, total:t.quiz.length,percent, date:new Date().toISOString()};save();$('#result').innerHTML='<div class="notice"><h2>Result: '+score+'/'+t.quiz.length+' ('+percent+'%)</h2>'+feedback+'<button class="btn" onclick="go(\'progress\')">View my progress</button> <button class="btn light" onclick="go(\'home\')">Dashboard</button></div>';e.target.querySelectorAll('input,button').forEach(x=>x.disabled=true)}}
function progress(v){let rows=courses.flatMap(c=>c.topics.map(t=>({c,t,r:data[doneKey(c,t)]}))),complete=rows.filter(x=>x.r).length;v.innerHTML='<div class="eyebrow">Learning report</div><h1>My progress</h1><p class="muted">Your lesson completion and assessment results are stored in this browser on this device.</p><div class="stats"><div class="card stat"><span class="muted">Completed topics</span><strong>'+complete+'</strong></div><div class="card stat"><span class="muted">Topics available</span><strong>'+rows.length+'</strong></div><div class="card stat"><span class="muted">Completion</span><strong>'+Math.round(complete/rows.length*100)+'%</strong></div></div><div class="panel"><h2>Topic results</h2>'+rows.map(x=>'<p><b>'+esc(x.c.grade+' '+x.c.subject)+'</b> — '+esc(x.t.title)+'<br><span class="muted">'+(x.r?'Completed · '+x.r.score+'/'+x.r.total+' ('+x.r.percent+'%)':'Not completed yet')+'</span></p>').join('<hr style="border:0;border-top:1px solid var(--line)">')+'<button class="btn light" onclick="exportCSV()">Download progress CSV</button></div>'}
function exportCSV(){let lines=[['Grade','Subject','Topic','Status','Score','Percentage'],...courses.flatMap(c=>c.topics.map(t=>{let r=data[doneKey(c,t)]||{};return [c.grade,c.subject,t.title,r.score===undefined?'Not completed':r.score+'/'+r.total,r.percent===undefined?'':r.percent+'%']}))];let csv=lines.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='genius-minds-progress.csv';a.click();URL.revokeObjectURL(a.href)}
function tutor(v){v.innerHTML='<div class="eyebrow">Tutor workspace</div><h1>Tutor area</h1><p class="muted">This starter version provides a preview of the learner library and progress recorded in this browser.</p><div class="grid"><div class="card"><h2>Course library</h2><strong>'+courses.length+' subjects</strong><p class="muted">Starter sample subjects across Grades 3–7.</p></div><div class="card"><h2>Progress records</h2><strong>'+Object.keys(data).length+' completed topics</strong><p class="muted">Export the learner progress report from My progress.</p></div><div class="card"><h2>Content planning</h2><p class="muted">New lessons and assessments can be added to the course data as the CAPS/ATP library is developed and checked.</p></div></div><div class="notice"><b>Important:</b> This is a demonstration tutor view, not a secure administrator account. It does not yet support separate learner logins or cloud-based records.</div><button class="btn" onclick="go('progress')">Open progress report</button>'}
$('#date').textContent=new Date().toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short',year:'numeric'});render();
</script>
</body></html>
